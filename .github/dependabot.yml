version: 2

updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    target-branch: main
    labels: [dependencies]
    commit-message:
      prefix: 'chore(deps)'
    groups:
      androidx:
        patterns: ['androidx.*', 'com.android.*']
      kotlin:
        patterns: ['org.jetbrains.kotlin*', 'org.jetbrains.kotlinx*']
      compose:
        patterns: ['androidx.compose.*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [ci]
