name: Build APK

# بیلد خودکار APK برای همه‌ی معماری‌ها بعد از هر merge (push به main) یا تگ
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build signed APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK platforms
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0" > /dev/null

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon testDebugUnitTest --stacktrace > gradle-test.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -nE "^e: |error:|Execution failed|FAILED" gradle-test.log | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit $code

      - name: Build debug + release (per-ABI + universal)
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon assembleDebug assembleRelease --stacktrace > gradle-build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -nE "^e: |error:|Execution failed|FAILED" gradle-build.log | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit $code

      - name: Verify signing (all APKs, identical certificate)
        shell: bash
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "Build tools: $BT"
          FINGERPRINTS=""
          for apk in $(find app/build/outputs/apk -name '*.apk' | sort); do
            echo "── $apk"
            OUT=$("$BT/apksigner" verify --print-certs "$apk" 2>&1) || { echo "::error::apksigner failed for $apk"; echo "$OUT"; exit 1; }
            FP=$(echo "$OUT" | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}')
            echo "   SHA-256: $FP"
            FINGERPRINTS="$FINGERPRINTS$apk -> $FP\n"
          done
          echo -e "$FINGERPRINTS"
          UNIQUE=$(printf "%b" "$FINGERPRINTS" | grep -v '^$' | awk -F'-> ' '{print $2}' | sort -u | wc -l)
          echo "Unique certificates: $UNIQUE"
          if [ "$UNIQUE" != "1" ]; then echo "::error::APKs are not signed with the same certificate"; exit 1; fi

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name '*.apk' -exec cp {} dist/ \;
          ls -la dist
          {
            echo "### APK ها"
            echo "| فایل | حجم |"
            echo "|---|---|"
            for f in dist/*.apk; do
              printf "| %s | %s |\n" "$(basename "$f")" "$(du -h "$f" | cut -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload per-architecture APKs
        uses: actions/upload-artifact@v7
        with:
          name: MarbleDU-apk-${{ github.sha }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APKs to release (tag / main)
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Build #{0}', github.run_number) }}
          body_path: CHANGELOG.md
          files: dist/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
